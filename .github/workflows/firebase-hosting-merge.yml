# Deploys the site to Firebase Hosting whenever main changes.
#
# The service account this uses was created by `firebase init hosting:github`
# and is held in the repository secret named below - nothing secret lives here.
name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_RISINGMATHS }}
          channelId: live
          projectId: risingmaths
