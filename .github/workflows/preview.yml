# Deploys a private preview of the site whenever the web-preview branch changes.
#
# This is a Firebase Hosting preview channel: a complete copy of the site at its
# own unlisted URL that expires on its own. The live site is untouched - nothing
# here runs on main. Push to this branch to try something before the public sees it.
name: Deploy a preview of the site

on:
  push:
    branches:
      - web-preview

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_RISINGMATHS }}
          projectId: risingmaths
          channelId: classtools-web
          expires: 30d
